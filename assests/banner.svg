<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Wahome Ndiritu - Software Engineer</title>
  <desc id="d">Banner for Wahome Ndiritu, Software Engineer, Full Stack Developer, AI and Automation, based in Nairobi, Kenya.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363D" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .line { opacity: 0; animation: reveal 0.5s ease forwards; }
    .l1 { animation-delay: 0.3s; }
    .l2 { animation-delay: 0.9s; }
    .l3 { animation-delay: 1.4s; }
    .l4 { animation-delay: 1.9s; }
    .l5 { animation-delay: 2.4s; }
    .cursor { animation: blink 1.1s steps(1) infinite; animation-delay: 2.8s; opacity: 0; }
    .fade-in { opacity: 0; animation: reveal 0.9s ease forwards; }
    @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .fade-in { animation: none; opacity: 1; }
      .cursor { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <rect width="1000" height="260" fill="url(#glow)"/>
    <rect x="0" y="0" width="6" height="260" fill="url(#name)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="259" rx="14" fill="none" stroke="#30363D"/>

  <!-- Left: identity -->
  <g class="fade-in">
    <text x="48" y="70" class="mono" font-size="14" fill="#8B949E">~/8WAHOME  <tspan fill="#3FB950">●</tspan> github.com/8WAHOME</text>
    <text x="48" y="135" class="sans" font-size="54" font-weight="700" fill="url(#name)">Wahome Ndiritu</text>
    <text x="48" y="172" class="sans" font-size="21" fill="#C9D1D9">Software Engineer  ·  Full Stack Developer</text>
    <text x="48" y="202" class="sans" font-size="21" fill="#C9D1D9">AI &amp; Automation</text>
    <text x="48" y="234" class="mono" font-size="13" fill="#8B949E">Nairobi, Kenya</text>
  </g>

  <!-- Right: decorative code window -->
  <g>
    <rect x="590" y="46" width="370" height="168" rx="10" fill="#0D1117" stroke="#30363D"/>
    <path d="M590 56a10 10 0 0 1 10-10h350a10 10 0 0 1 10 10v18H590z" fill="#161B22"/>
    <circle cx="610" cy="60" r="5" fill="#FF5F56"/>
    <circle cx="628" cy="60" r="5" fill="#FFBD2E"/>
    <circle cx="646" cy="60" r="5" fill="#27C93F"/>
    <text x="780" y="64" class="mono" font-size="11" fill="#8B949E" text-anchor="middle">focus.js</text>

    <g class="mono" font-size="14">
      <text class="line l1" x="610" y="102"><tspan fill="#FF7B72">const</tspan> <tspan fill="#79C0FF">focus</tspan> <tspan fill="#C9D1D9">= [</tspan></text>
      <text class="line l2" x="630" y="126"><tspan fill="#A5D6FF">"full-stack web apps"</tspan><tspan fill="#C9D1D9">,</tspan></text>
      <text class="line l3" x="630" y="148"><tspan fill="#A5D6FF">"REST APIs"</tspan><tspan fill="#C9D1D9">,</tspan></text>
      <text class="line l4" x="630" y="170"><tspan fill="#A5D6FF">"workflow automation"</tspan><tspan fill="#C9D1D9">,</tspan></text>
      <text class="line l5" x="610" y="194"><tspan fill="#C9D1D9">];</tspan></text>
    </g>
    <rect class="cursor" x="634" y="182" width="8" height="15" fill="#58A6FF"/>
  </g>
</svg>
